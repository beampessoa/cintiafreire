<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caneca paramétrica · Touché3D</title>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<style>
  :root{
    --fundo:#0A0F0D; --painel:#101815; --campo:#0C1310;
    --linha:#1E2C26; --linha-forte:#2C4038;
    --texto:#D6E2DC; --apagado:#6F847B;
    --verde:#10B981; --verde-fraco:#0B6B4E; --ambar:#D9A441; --vermelho:#E0644E;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--fundo); color:var(--texto); font-family:var(--sans);
       display:grid; grid-template-rows:auto 1fr}

  header{display:flex; align-items:baseline; gap:14px;
         padding:14px 20px; border-bottom:1px solid var(--linha)}
  header h1{margin:0; font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase}
  header .sub{font-family:var(--mono); font-size:11px; color:var(--apagado)}
  header .estado{margin-left:auto; font-family:var(--mono); font-size:11px;
                 color:var(--apagado); display:flex; align-items:center; gap:7px}
  header .estado::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--apagado)}
  body[data-estado="ocupado"] header .estado::before{background:var(--ambar)}
  body[data-estado="pronto"]  header .estado::before{background:var(--verde)}
  body[data-estado="erro"]    header .estado::before{background:var(--vermelho)}

  main{display:grid; grid-template-columns:326px 1fr; min-height:0}

  aside{border-right:1px solid var(--linha); overflow-y:auto; padding:4px 0 90px; background:var(--painel)}
  fieldset{border:0; margin:0; padding:16px 18px; border-bottom:1px solid var(--linha)}
  legend{padding:0; font-family:var(--mono); font-size:10px; letter-spacing:.18em;
         text-transform:uppercase; color:var(--verde)}
  .campo{margin-top:14px}
  .campo .topo{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
  .campo label{font-size:12.5px}
  .campo .valor{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--apagado)}
  .campo.alerta .valor{color:var(--ambar)}
  .campo.invalido .valor{color:var(--vermelho)}

  input[type=range]{width:100%; accent-color:var(--verde); background:transparent}
  input[type=file]{width:100%; font-family:var(--mono); font-size:11px; color:var(--apagado)}
  input[type=file]::file-selector-button{
    padding:6px 11px; margin-right:9px; border-radius:3px; cursor:pointer;
    border:1px solid var(--linha-forte); background:var(--painel); color:var(--texto);
    font-family:var(--sans); font-size:11.5px}
  input[type=file]::file-selector-button:hover{border-color:var(--verde)}
  input[type=text], input[type=number], select{
    width:100%; padding:7px 9px; background:var(--campo); color:var(--texto);
    border:1px solid var(--linha-forte); border-radius:3px;
    font-family:var(--mono); font-size:13px}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--verde); outline-offset:2px}
  .interruptor{display:flex; align-items:center; gap:9px; cursor:pointer; font-size:12.5px}
  .interruptor input{accent-color:var(--verde); width:15px; height:15px}

  .predefinidos{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  .predefinidos button{padding:6px 11px; font-size:11.5px}
  .pintura{margin-top:10px; font-family:var(--mono); font-size:11.5px; line-height:1.9}
  .pintura div{display:flex; gap:6px; color:var(--apagado)}
  .pintura b{color:var(--verde); font-weight:500; min-width:38px; text-align:right}
  .pintura span{margin-left:8px; color:var(--texto); min-width:66px}
  .pintura i{font-style:normal; color:var(--apagado)}
  .predefinidos button.meu{border-color:var(--verde-fraco); padding-right:7px}
  .predefinidos .apagar{margin-left:8px; color:var(--apagado); font-size:14px; line-height:1}
  .predefinidos .apagar:hover{color:var(--vermelho)}

  section.palco{position:relative; min-width:0;
    background:radial-gradient(120% 90% at 50% 0%, #0E1714 0%, var(--fundo) 70%)}
  canvas{display:block; width:100%; height:100%; cursor:grab}
  canvas:active{cursor:grabbing}

  .leitura{position:absolute; left:22px; bottom:22px; pointer-events:none;
           font-family:var(--mono); font-size:11px; line-height:1.9; color:var(--apagado)}
  .leitura b{color:var(--texto); font-weight:500}
  .leitura span{color:var(--verde-fraco)}
  .leitura .destaque b{color:var(--verde)}

  .diagnostico{position:absolute; left:22px; right:22px; top:22px;
    display:flex; flex-direction:column; gap:8px; max-height:46%; overflow:auto}
  .diagnostico div{padding:9px 12px; border-radius:4px; white-space:pre-wrap;
    font-family:var(--mono); font-size:11.5px; line-height:1.55}
  .diagnostico .e{border:1px solid var(--vermelho); background:#1A0F0D; color:#F3C4BA}
  .diagnostico .a{border:1px solid #4A3A15; background:#171208; color:#E6CF9A}

  .acoes{position:absolute; right:22px; bottom:22px; display:flex; gap:10px}
  button{padding:10px 16px; border-radius:3px; cursor:pointer;
    font-family:var(--sans); font-size:12.5px; font-weight:500;
    border:1px solid var(--linha-forte); background:var(--painel); color:var(--texto)}
  button:hover{border-color:var(--verde)}
  button.principal{background:var(--verde); border-color:var(--verde); color:#04120C; font-weight:600}
  button:disabled{opacity:.4; cursor:not-allowed; border-color:var(--linha-forte);
                  background:var(--painel); color:var(--apagado)}

  @media (max-width:820px){
    main{grid-template-columns:1fr; grid-template-rows:minmax(300px,45vh) 1fr}
    aside{border-right:0; border-bottom:1px solid var(--linha); order:2; padding-bottom:20px}
    section.palco{order:1}
    .acoes{position:static; padding:14px 18px; border-top:1px solid var(--linha)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<body data-estado="carregando">

<header>
  <h1>Caneca paramétrica</h1>
  <span class="sub">Touché3D</span>
  <span class="estado" id="estado">carregando OpenSCAD…</span>
</header>

<main>
  <aside id="painel"></aside>

  <section class="palco">
    <canvas id="tela"></canvas>
    <div class="leitura" id="leitura"></div>
    <div class="diagnostico" id="diagnostico"></div>
    <div class="acoes">
      <button id="btn-scad">Baixar .scad</button>
      <button id="btn-stl" class="principal">Exportar STL</button>
    </div>
  </section>
</main>

// se bebe.
// Copo Stanley 473: 69 mm na base, 91 na boca, 165 de altura.
// Cone de 3,8° por lado. O suporte pega 105 mm — o copo desce e
// encunha, e sobram 60 mm para a mão e para a tampa.
//   base: 69 + 1,5 de folga  = 70,5

  'Industrial': { faixa_rel:2.2, faixa_raio:0.4, garganta:1.0, alca_barra:12, alca_raio:2, alca_raiz:6, alca_larg:18 },
  'Sem alça':   { alca:false },
};

const RES_PREVIA     = 48;
const DENSIDADE      = 1.24;   // PLA, g/cm³
const DIAM_FILAMENTO = 1.75;   // mm
const VOLUME_A1      = 256;    // mm, cubo útil da Bambu Lab A1

/* ============================================================
   2. Estado — URL, senão último uso, senão padrão.
   ============================================================ */
const TODOS = CAMPOS.concat(QUALIDADE, PINTURA, MATERIAL).filter(c => c.tipo !== 'arquivo');
const estado = {};
for (const c of TODOS) estado[c.nome] = c.valor;

(function restaurar(){
  let salvo = {};
  try { salvo = JSON.parse(localStorage.getItem('caneca') || '{}'); } catch(_){}
  const daUrl = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  for (const c of TODOS) {
    const bruto = daUrl[c.nome] ?? salvo[c.nome];
    if (bruto === undefined) continue;
    if (c.tipo === 'booleano')                       estado[c.nome] = bruto === true || bruto === 'true';
    else if (c.tipo === 'texto' || c.tipo === 'opcao') estado[c.nome] = String(bruto);
    else                                              estado[c.nome] = Number(bruto);
  }
})();

function guardar(){
  localStorage.setItem('caneca', JSON.stringify(estado));
  location.replace('#' + new URLSearchParams(estado).toString());
}

// Só os campos que o OpenSCAD conhece.
function paraOpenscad(extra){
  const p = {};
  for (const c of CAMPOS) {
    if (c.tipo === 'arquivo') p[c.flag] = !!svgs[c.chave];
    else p[c.nome] = estado[c.nome];
  }
  return Object.assign(p, extra);
}

// Altura do desenho do escudo, deduzida da proporção do SVG.
function alturaEscudo(){
  if (svgs.escudo && props.escudo) return estado.escudo_larg / props.escudo;
  return estado.escudo_alt;
}

/* ============================================================
   3. Validação. Erro bloqueia a exportação; aviso não.
   ============================================================ */
function validar(){
  const e = [], a = [];
  const s = estado;
  const con = s.conicidade || 0;
  const riZ = (z) => s.diam_interno/2 + (con/2) * (z / s.altura);
  const reZ = (z) => riZ(z) + s.parede;
  const de  = s.diam_interno + con + 2 * s.parede;   // no topo, o maior
  const re_ = reZ(s.altura / 2);
  const sal    = s.faixa ? s.faixa_rel : 0;
  const alta_i = s.faixa_modo_inf !== 'baixa';
  const alta_s = s.faixa_modo_sup !== 'baixa';
  const Rfi = s.faixa ? (alta_i ? re_ + sal : re_ - sal) : re_;
  const Rfs = s.faixa ? (alta_s ? reZ(s.altura) + sal : reZ(s.altura) - sal) : reZ(s.altura);
  const garh = 1.2;
  const gar  = s.faixa ? s.garganta : 0;

  // pilha de baixo
  const hs = s.faixa ? [s.faixa_inf_1, s.faixa_inf_2, s.faixa_inf_3].filter(h => h > 0) : [];
  const acum = (i) => hs.slice(0, i+1).reduce((x,y) => x+y, 0);
  const base_de = (i) => i === 0 ? 0 : acum(i-1) + i * garh;
  const topo_de = (i) => acum(i) + i * garh;
  const fim_inf = hs.length ? topo_de(hs.length-1) + garh : 0;

  const sup_on = s.faixa && s.faixa_sup_h > 0;
  const Rtop = (sup_on && alta_s) ? Rfs : re_;
  const rrt  = (Rtop - riZ(s.altura)) / 2;
  const Zsup_topo = alta_s ? s.altura - rrt : s.altura - rrt - garh;
  const topo_corpo = sup_on ? (alta_s ? Zsup_topo - s.faixa_sup_h - garh
                                      : Zsup_topo - s.faixa_sup_h)
                            : s.altura - rrt;

  if (s.peca === 'gabarito') {
    if (!s.escudo) e.push('A placa só faz sentido com o rebaixo ligado.');
    const larg = svgs.escudo ? s.escudo_larg
                          : s.escudo_ang * Math.PI/180 * (re_ - s.escudo_prof + s.escudo_esp/2) - 2*s.escudo_folga;
    const alt  = svgs.escudo ? alturaEscudo() : s.escudo_alt - 2*s.escudo_folga;
    if (larg < 5) e.push('A placa ficou pequena demais.');
    else a.push(`Placa de ${larg.toFixed(1)} × ${alt.toFixed(1)} mm`
              + (svgs.escudo ? ' com a silhueta do SVG. ' : ' retangular. ')
              + 'Imprima deitada, aqueça e conforme dentro do rebaixo.');
    return { erros:e, avisos:a };
  }

  if (s.parede < 1.2) e.push(`Parede de ${s.parede} mm não fecha com bico de 0,4 — mínimo 1,2 mm.`);
  else if (s.parede < 1.6) a.push('Parede fina: 3 perímetros pedem 1,6 mm ou mais.');
  if (s.fundo < 1.2) e.push('Fundo abaixo de 1,2 mm vaza.');
  if (s.altura > VOLUME_A1) e.push(`Altura de ${s.altura} mm passa dos ${VOLUME_A1} mm da A1.`);
  if (2*Math.max(Rfi, Rfs, reZ(s.altura)) > VOLUME_A1)     e.push(`Diâmetro externo de ${(2*Math.max(Rfi,Rfs,reZ(s.altura))).toFixed(1)} mm passa dos ${VOLUME_A1} mm da A1.`);
  if (s.chanfro > s.fundo)  a.push('O chanfro é maior que o fundo — a base fica fina na borda.');
  if (con > 0) {
    const ang = Math.atan((con/2) / s.altura) * 180 / Math.PI;
    a.push(`Cone de ${ang.toFixed(1)}° por lado: Ø ${s.diam_interno} na base, `
         + `Ø ${(s.diam_interno + con).toFixed(1)} na boca.`);
    if (ang > 12) a.push('Cone acima de 12°: a parede externa vira balanço e o fatiador vai pedir suporte.');
    if (con >= s.diam_interno) e.push('A conicidade é maior que o próprio diâmetro da base.');
  }

  if (s.faixa) {
    if (hs.length === 0 && !sup_on) a.push('As faixas estão ligadas mas todas com altura zero.');
    if (fim_inf + 4 >= topo_corpo)
      e.push('A pilha de baixo encostou na faixa de cima — não sobrou corpo entre elas.');
    if ((alta_i || alta_s) && s.garganta >= s.parede - 0.8)
      e.push(`Garganta de ${s.garganta} mm numa parede de ${s.parede} mm deixa parede fina demais.`);
    if ((!alta_i || !alta_s) && sal >= s.parede - 0.8)
      e.push(`Faixa escavada ${s.faixa_rel} mm numa parede de ${s.parede} mm deixa menos de 0,8 mm de parede.`);
    if (!alta_i && !alta_s && s.garganta > 0.05)
      a.push('Com todas as faixas escavadas a garganta não é usada — a parede entre elas já faz a separação.');
    if (hs.length > 1 && !alta_i && s.garganta > 0.05)
      a.push('A pilha escavada não usa a garganta: a parede entre os sulcos já separa.');
    if (s.faixa_raio > sal - 0.1)
      a.push('O raio da aresta é maior que a própria faixa — ela vira uma ondulação em vez de um volume.');
    const menor = Math.min(...hs.concat(sup_on ? [s.faixa_sup_h] : []).filter(h=>h>0));
    if (isFinite(menor) && s.faixa_raio > menor/3)
      a.push(`O raio de ${s.faixa_raio} mm come a faixa de ${menor} mm — ela vira um tubo arredondado.`);
    if (sal < 0.8) a.push('Faixa quase rente ao corpo: não vai ler como peça sobreposta.');
  }

  // ---- alça
  if (s.alca) {
    const t  = s.alca_barra, tr = t + s.alca_raiz, L = s.alca_compr, A = s.alca_alt;
    if (s.alca_embutir >= s.parede)
      e.push('A alça entra mais que a espessura da parede — os braços furam para dentro da caneca.');
    if (s.alca_raio > t/2 - 0.2) e.push('O raio das arestas é maior que metade da barra.');
    if (s.alca_raio > s.alca_larg/2 - 0.2) e.push('O raio das arestas é maior que metade da largura.');

    const zt0 = s.altura/2 + A/2;
    const espalha = tr * s.alca_pe;
    const transic = Math.max(tr * 0.6, espalha * 0.45);
    const xw  = reZ(zt0) + transic;
    const xo  = reZ(zt0) + L;
    const zt  = zt0;
    const zb  = s.altura/2 - A/2;
    const zbo = zb + (xo - xw) * Math.tan(s.alca_incl * Math.PI/180);
    const total = xo + t/2 + re_;
    if (L <= transic + t)
      e.push(`Com um pé desse tamanho a transição já ocupa ${transic.toFixed(0)} mm — aumente o avanço ou reduza o espalhamento do pé.`);
    if (total > VOLUME_A1) e.push(`Com a alça a peça mede ${total.toFixed(0)} mm — não cabe na mesa da A1.`);

    if (s.alca_incl < 45)
      a.push(`Braço de baixo a ${s.alca_incl}°: abaixo de 45° o fatiador vai pedir suporte.`);

    const pe = espalha / 2;
    if (zt + pe > s.altura - rrt) e.push('O pé da alça passa da borda da caneca.');
    if (zb - pe < 0)              e.push('O pé da alça passa da base.');

    const vao_a = (zt - t/2) - (zbo + t/2);
    const vao_l = (xo - xw) - tr/2 - t/2;
    if (vao_a <= 2) e.push('A alça fechou: a inclinação consumiu o vão. Aumente o vão entre braços ou reduza o avanço.');
    else if (vao_a < 26) a.push(`Vão de ${vao_a.toFixed(0)} mm de altura: cabem dois dedos.`);
    if (vao_l < 22) a.push(`Vão de ${vao_l.toFixed(0)} mm de profundidade: dedo grosso não entra.`);
    if (s.alca_raiz > t) a.push('A raiz ficou mais que o dobro da barra — a conicidade fica exagerada.');
  }

  // ---- escudo
  if (s.escudo) {
    const z  = s.altura * 0.58;
    const ha = alturaEscudo();
        if (svgs.escudo && props.escudo)
      a.push(`Silhueta: ${s.escudo_larg} × ${ha.toFixed(1)} mm, ${svgs.escudo.contornos} contorno${svgs.escudo.contornos>1?'s':''}.`);
    if (s.escudo_prof >= s.parede - 0.8)
      e.push(`Rebaixo de ${s.escudo_prof} mm numa parede de ${s.parede} mm deixa menos de 0,8 mm de fundo.`);
    if (z + ha/2 > topo_corpo) e.push('O rebaixo invade a faixa de cima — reduza a largura do desenho ou a altura das faixas.');
    if (z - ha/2 < fim_inf)    e.push('O rebaixo invade a pilha de baixo — reduza a largura do desenho ou a altura das faixas.');
    const largura_mm = svgs.escudo ? s.escudo_larg : s.escudo_ang * Math.PI/180 * re_;
    if (largura_mm > re_ * 1.6) a.push('Desenho muito largo para o diâmetro: a placa fica difícil de conformar.');
    if (s.escudo_esp < s.escudo_prof)
      a.push('A placa é mais fina que o rebaixo — o escudo vai afundar em vez de ficar saliente.');
    else if (s.escudo_esp - s.escudo_prof < 0.4)
      a.push('A placa mal sobressai. Deixe uns 0,6 mm para a sombra esconder a fresta.');
    if (s.escudo_folga < 0.2) a.push('Folga abaixo de 0,2 mm: a placa pode não entrar nem quente.');
  }

  // ---- estampa
  if (svgs.estampa) {
    const z0 = fim_inf + s.estampa_margem;
    const z1 = topo_corpo - s.estampa_margem;
    if (z1 - z0 < s.estampa_tam)
      e.push('Não sobrou corpo livre para a estampa. Reduza a folga até as faixas ou o tamanho do motivo.');
    else {
      const passo_z = (z1 - z0) / s.estampa_linhas;
      const prop = props.estampa;
      const alt_mot = prop ? s.estampa_tam / prop : s.estampa_tam;
      if (alt_mot > passo_z * 0.95)
        a.push(`As fileiras se tocam: motivo de ${alt_mot.toFixed(0)} mm num passo de ${passo_z.toFixed(0)} mm. Reduza fileiras ou tamanho.`);
      const passo_a = 360 / s.estampa_cols * Math.PI/180 * re_;
      if (s.estampa_tam > passo_a * 0.95)
        a.push(`Os motivos se tocam em volta: ${s.estampa_tam} mm num passo de ${passo_a.toFixed(0)} mm. Reduza a quantidade ou o tamanho.`);
      if (s.estampa_relevo !== 'alto' && s.estampa_prof >= s.parede - 0.8)
        e.push('A estampa escavada deixa a parede fina demais.');
      const total = s.estampa_cols * s.estampa_linhas;
      if (total > 60) a.push(`${total} motivos: o render vai demorar. Acima disso, prefira exportar e conferir no fatiador.`);
    }
  }

  // ---- gravação
  const n = (s.texto || '').length;
  if (n > 0) {
    if (s.letra_z + s.letra_tam/2 > topo_corpo)
      a.push('O nome invade a faixa de cima. Para escrever na faixa, use o bloco "Texto nas faixas".');
    if (s.letra_z - s.letra_tam/2 < fim_inf)
      a.push('O nome invade a faixa de baixo. Para escrever na faixa, use o bloco "Texto nas faixas".');
    if (s.relevo !== 'alto' && s.letra_prof >= s.parede - 0.6)
      e.push(`Gravar ${s.letra_prof} mm numa parede de ${s.parede} mm fura a parede.`);

    const passo_ideal = (s.letra_tam * 1.05 / re_) * 180 / Math.PI;
    const passo_cabe  = n > 1 ? 200 / (n - 1) : passo_ideal;
    if (passo_cabe < passo_ideal)
      a.push(`"${s.texto}" não cabe no tamanho pedido — as letras saem ${Math.round(100*passo_cabe/passo_ideal)}% do tamanho.`);

    if (s.alca) {
      const meia_alca  = Math.atan2(s.alca_larg/2, re_) * 180/Math.PI + 6;
      const meia_texto = (n-1) * Math.min(passo_ideal, passo_cabe)/2 + (s.letra_tam*0.5/re_)*180/Math.PI;
      const d = Math.abs((((s.letra_ang + 180) % 360) + 360) % 360 - 180);
      if (d < meia_alca + meia_texto) a.push('A gravação passa por trás da alça.');
    }
    if (svgs.estampa)
      a.push('A estampa cobre o corpo inteiro: o nome vai ficar por cima dela. Considere mover o nome para uma faixa.');
    if (s.escudo) {
      const dz = Math.abs(s.letra_z - s.altura*0.58);
      const d180 = Math.abs(((s.letra_ang % 360) + 360) % 360 - 180);
      if (d180 < s.escudo_ang/2 + 4 && dz < (s.escudo_alt + s.letra_tam)/2)
        a.push('A gravação cai dentro do rebaixo do escudo.');
    }
  }

  // ---- texto nas faixas
  if (s.faixa) {
    const alvos = hs.map((h, i) => [[s.texto_inf_1, s.texto_inf_2, s.texto_inf_3][i] || '', h, `${i+1}ª faixa`])
                    .concat(sup_on ? [[s.texto_sup || '', s.faixa_sup_h, 'faixa de cima']] : []);
    let algum = false;
    for (const [txt, h, onde] of alvos) {
      const n2 = txt.length;
      if (n2 === 0) continue;
      algum = true;
      const tam = Math.min(s.faixa_letra, h * 0.6);
      if (tam < 3) { a.push(`A ${onde} tem ${h} mm — letra legível só a partir de uns 5 mm de faixa.`); continue; }
      if (tam < s.faixa_letra - 0.1)
        a.push(`Na ${onde} a letra cai para ${tam.toFixed(1)} mm por causa da altura da faixa.`);
      if (n2 < 2) continue;
      const pi = (tam * 1.05 / (onde === 'faixa de cima' ? Rfs : Rfi)) * 180 / Math.PI;
      const pc = s.faixa_arco / (n2 - 1);
      if (pc < pi * 0.55)
        e.push(`"${txt}" não cabe na ${onde}: ficaria com menos da metade do tamanho. Encurte ou aumente o arco.`);
      else if (pc < pi)
        a.push(`"${txt}" sai ${Math.round(100*pc/pi)}% do tamanho na ${onde}.`);
    }
    if (algum) {
      if (s.faixa_relevo === 'alto')
        a.push('Letra saliente vira ilha solta em cada camada: o bico retrai e recomeça centenas de vezes '
             + 'e o filamento embola. Use "Embutido" — mesma cor separada, superfície lisa.');
      const disp = Math.min(alta_i ? sal + s.parede : s.parede - sal,
                            alta_s ? sal + s.parede : s.parede - sal);
      if (s.faixa_relevo !== 'alto' && s.faixa_prof >= disp - 0.8)
        e.push('A gravação atravessa a faixa e a parede — reduza a profundidade.');
      if (s.alca && s.faixa_arco > 300)
        a.push('Arco acima de 300°: o texto das faixas vai passar atrás da alça.');
    }
  }

  return { erros:e, avisos:a };
}

/* ============================================================
   4. Painel
   ============================================================ */
const painel = document.getElementById('painel');

function montarCampo(c){
  const div = document.createElement('div');
  div.className = 'campo';
  div.dataset.campo = c.nome;

  if (c.tipo === 'booleano') {
    div.innerHTML = `<label class="interruptor">
      <input type="checkbox" data-nome="${c.nome}" ${estado[c.nome] ? 'checked' : ''}> ${c.rotulo}</label>`;
  } else if (c.tipo === 'texto') {
    div.innerHTML = `<div class="topo"><label for="f-${c.nome}">${c.rotulo}</label></div>
      <input type="text" id="f-${c.nome}" data-nome="${c.nome}" maxlength="24" value="${estado[c.nome]}">`;
  } else if (c.tipo === 'arquivo') {
    div.innerHTML = `<div class="topo"><label for="f-${c.nome}">${c.rotulo}</label>
        <span class="valor" id="v-${c.nome}">nenhum</span></div>
      <input type="file" id="f-${c.nome}" data-chave="${c.chave}" accept=".svg,image/svg+xml">`;
  } else if (c.tipo === 'opcao') {
    div.innerHTML = `<div class="topo"><label for="f-${c.nome}">${c.rotulo}</label></div>
      <select id="f-${c.nome}" data-nome="${c.nome}">${
        c.opcoes.map(([v,r]) => `<option value="${v}" ${estado[c.nome]===v?'selected':''}>${r}</option>`).join('')}</select>`;
  } else {
    div.innerHTML = `<div class="topo">
        <label for="f-${c.nome}">${c.rotulo}</label>
        <span class="valor" id="v-${c.nome}">${estado[c.nome]} ${c.un}</span></div>
      <input type="range" id="f-${c.nome}" data-nome="${c.nome}"
             min="${c.min}" max="${c.max}" step="${c.passo}" value="${estado[c.nome]}">`;
  }
  return div;
}

for (const grupo of [...new Set(CAMPOS.map(c => c.grupo))]) {
  const bloco = document.createElement('fieldset');
  bloco.innerHTML = `<legend>${grupo}</legend>`;
  for (const c of CAMPOS.filter(x => x.grupo === grupo)) bloco.appendChild(montarCampo(c));
  painel.appendChild(bloco);
}

const blocoQual = document.createElement('fieldset');
blocoQual.innerHTML = `<legend>Qualidade</legend>`;
for (const c of QUALIDADE) blocoQual.appendChild(montarCampo(c));
painel.appendChild(blocoQual);

const blocoMat = document.createElement('fieldset');
blocoMat.innerHTML = `<legend>Material</legend>`;
for (const c of MATERIAL) blocoMat.appendChild(montarCampo(c));
painel.appendChild(blocoMat);

const blocoPint = document.createElement('fieldset');
blocoPint.innerHTML = `<legend>Pintura no fatiador</legend>`;
for (const c of PINTURA) blocoPint.appendChild(montarCampo(c));
blocoPint.insertAdjacentHTML('beforeend', `
  <div class="pintura" id="pintura"></div>
  <div class="predefinidos" style="margin-top:10px">
    <button id="btn-copiar-z">Copiar faixas</button>
  </div>`);
painel.appendChild(blocoPint);

// As faixas do modelo são intervalos exatos de Z, então o
// Height range modifier do fatiador pinta todas de uma vez.
// Os limites caem no meio das gargantas: é onde a troca de cor
// fica escondida na sombra.
function faixasDeAltura(){
  const s = estado;
  const re_ = s.diam_interno/2 + s.parede;
  const sal = s.faixa ? s.faixa_rel : 0;
  const alta_s = s.faixa_modo_sup !== 'baixa';
  const sup_on = s.faixa && s.faixa_sup_h > 0;
  const Rfs = s.faixa ? (alta_s ? re_ + sal : re_ - sal) : re_;
  const rrt = ((sup_on && alta_s ? Rfs : re_) - s.diam_interno/2) / 2;
  const garh = 1.2;

  const hs = s.faixa ? [s.faixa_inf_1, s.faixa_inf_2, s.faixa_inf_3].filter(h => h > 0) : [];
  const acum = (i) => hs.slice(0, i+1).reduce((x,y) => x+y, 0);
  const topo_de = (i) => acum(i) + i * garh;

  const linhas = [];
  let corte = 0;
  hs.forEach((h, i) => {
    const fim = topo_de(i) + (i < hs.length - 1 ? garh/2 : garh/2);
    linhas.push([corte, fim, `faixa ${i+1} (${h} mm)`]);
    corte = fim;
  });

  const Zsup_topo = alta_s ? s.altura - rrt : s.altura - rrt - garh;
  const fimCorpo = sup_on ? Zsup_topo - s.faixa_sup_h - garh/2 : s.altura;
  const meio = (corte + fimCorpo) / 2;

  linhas.push([corte, meio, 'corpo · metade de baixo']);
  linhas.push([meio, fimCorpo, 'corpo · metade de cima']);
  if (sup_on) linhas.push([fimCorpo, s.altura, `faixa de cima (${s.faixa_sup_h} mm)`]);

  return linhas;
}

function coresDaVez(){
  return (estado.cores || '').split(',').map(x => x.trim());
}

function textoFaixas(){

/* ------------------------------------------------------------
   SVG → polígono.

   Este build do OpenSCAD não importa SVG, mas o navegador
   interpreta SVG nativamente. Então o desenho é achatado aqui:
   cada subcaminho vira uma lista de pontos, normalizada para
   largura 1 e centrada na origem. O .scad só recebe números.
   ------------------------------------------------------------ */

const oculto = document.createElement('div');
oculto.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none';
document.body.appendChild(oculto);

// Formas básicas viram 'd' para tudo seguir um caminho só.
function paraD(el){
  const n = el.tagName.toLowerCase();
  const g = (a, p = 0) => parseFloat(el.getAttribute(a) || p);
  if (n === 'path') return el.getAttribute('d') || '';
  if (n === 'rect') {
    const x = g('x'), y = g('y'), w = g('width'), h = g('height');
    return `M${x},${y}H${x+w}V${y+h}H${x}Z`;
  }
  if (n === 'circle' || n === 'ellipse') {
    const cx = g('cx'), cy = g('cy');
    const rx = n === 'circle' ? g('r') : g('rx');
    const ry = n === 'circle' ? g('r') : g('ry');
    return `M${cx-rx},${cy}a${rx},${ry} 0 1,0 ${2*rx},0a${rx},${ry} 0 1,0 ${-2*rx},0Z`;
  }
  if (n === 'polygon' || n === 'polyline') {
    const pts = (el.getAttribute('points') || '').trim().split(/[\s,]+/);
    if (pts.length < 4) return '';
    let d = `M${pts[0]},${pts[1]}`;
    for (let i = 2; i < pts.length - 1; i += 2) d += `L${pts[i]},${pts[i+1]}`;
    return d + 'Z';
  }
  return '';
}

// Um 'd' com vários M vira vários contornos independentes —
// é isso que faz o miolo de um R ou de um B ficar vazado.
function subcaminhos(d){
  const partes = d.match(/[Mm][^Mm]*/g);
  return partes ? partes.filter(x => x.trim().length > 2) : [];
}

function svgParaPoligono(texto){
  const doc = new DOMParser().parseFromString(texto, 'image/svg+xml');
  const raiz = doc.querySelector('svg');
  if (!raiz) throw new Error('Arquivo não parece um SVG.');

  oculto.innerHTML = '';
  oculto.appendChild(document.importNode(raiz, true));
  const svg = oculto.querySelector('svg');
  const NS = 'http://www.w3.org/2000/svg';

  const contornos = [];
  for (const el of svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline')) {
    const d = paraD(el);
    if (!d) continue;
    const m = el.getCTM();

    for (const sub of subcaminhos(d)) {
      const tmp = document.createElementNS(NS, 'path');
      tmp.setAttribute('d', sub);
      svg.appendChild(tmp);

      let comp = 0;
      try { comp = tmp.getTotalLength(); } catch (_) {}
      if (comp > 0.5) {
        const n = Math.max(16, Math.min(220, Math.round(comp / 0.5)));
        const pts = [];
        for (let i = 0; i < n; i++) {
          let pt = tmp.getPointAtLength(comp * i / n);
          if (m) pt = new DOMPoint(pt.x, pt.y).matrixTransform(m);
          pts.push([pt.x, pt.y]);
        }
        contornos.push(pts);
      }
      svg.removeChild(tmp);
    }
  }
  oculto.innerHTML = '';

  if (!contornos.length)
    throw new Error('Nenhum contorno fechado. No Inkscape: Caminho → Objeto para caminho e Contorno para caminho.');

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of contornos) for (const [x, y] of c) {
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const larg = x1 - x0, alt = y1 - y0;
  if (!(larg > 0) || !(alt > 0)) throw new Error('O desenho ficou sem dimensão.');

  // largura 1, centrado, com Y invertido (no SVG o Y cresce para baixo)
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const pontos = [], caminhos = [];
  for (const c of contornos) {
    const idx = [];
    for (const [x, y] of c) {
      idx.push(pontos.length);
      pontos.push([(x - cx) / larg, -(y - cy) / larg]);
    }
    caminhos.push(idx);
  }
  return { pontos, caminhos, proporcao: larg / alt, contornos: contornos.length };
}

function comoScad(nome, r){
  const num = (v) => Math.round(v * 100000) / 100000;
  if (!r) return `${nome}_pts = [];\n${nome}_paths = [];\n`;
  return `${nome}_pts = [${r.pontos.map(p => `[${num(p[0])},${num(p[1])}]`).join(',')}];\n`
       + `${nome}_paths = [${r.caminhos.map(c => `[${c.join(',')}]`).join(',')}];\n`;
}

// Os desenhos ficam fora do estado: são grandes demais para a URL.

const tela = document.getElementById('tela');

renderizador.shadowMap.type = THREE.PCFSoftShadowMap;

const cena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);

cena.add(new THREE.HemisphereLight(0xBFE8D6, 0x0A0F0D, 0.85));
const luz = new THREE.DirectionalLight(0xffffff, 1.5);
luz.position.set(140, 260, 190);

// Chão: grade a cada 10 mm e sombra projetada. Dá escala à peça.

cena.add(grade);

chao.position.y = 0.02;

const material = new THREE.MeshStandardMaterial({ color:0x10B981, roughness:0.5, metalness:0.05 });
let malha = null;

let giro = 0.7, inclina = 1.15, distancia = 320;
let arrastando = false, ux = 0, uy = 0;
tela.addEventListener('pointerdown', e => { arrastando = true; ux=e.clientX; uy=e.clientY; tela.setPointerCapture(e.pointerId); });
tela.addEventListener('pointerup',   e => { arrastando = false; tela.releasePointerCapture(e.pointerId); });
tela.addEventListener('pointermove', e => {
  if (!arrastando) return;
  giro    -= (e.clientX - ux) * 0.008;
  inclina -= (e.clientY - uy) * 0.008;
  inclina  = Math.max(0.12, Math.min(Math.PI/2 - 0.02, inclina));
  ux = e.clientX; uy = e.clientY;
});
tela.addEventListener('wheel', e => {
  e.preventDefault();
  distancia = Math.max(80, Math.min(1400, distancia * (1 + Math.sign(e.deltaY) * 0.12)));
}, { passive:false });

let alvoY = 50;
function ajustarTamanho(){
  const l = tela.clientWidth, a = tela.clientHeight;
  if (!l || !a) return;
  renderizador.setSize(l, a, false);
  camera.aspect = l / a;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustarTamanho);

function laco(){
  ajustarTamanho();
  camera.position.set(
    distancia * Math.sin(inclina) * Math.sin(giro),
    alvoY + distancia * Math.cos(inclina),
    distancia * Math.sin(inclina) * Math.cos(giro)
  );
  camera.lookAt(0, alvoY, 0);
  renderizador.render(cena, camera);
  requestAnimationFrame(laco);
}
laco();

/* ============================================================
   6. STL → geometria. O volume sai da própria malha, então é
   o volume real do sólido, não uma fórmula aproximada.
   ============================================================ */
function lerSTL(buffer){
  const dv = new DataView(buffer);
  const n = buffer.byteLength >= 84 ? dv.getUint32(80, true) : 0;
  return (buffer.byteLength === 84 + n * 50) ? lerBinario(dv, n)
                                             : lerTexto(new TextDecoder().decode(buffer));
}
function lerBinario(dv, n){
  const pos = new Float32Array(n * 9);
  for (let i = 0, p = 0; i < n; i++){
    let o = 84 + i * 50 + 12;
    for (let v = 0; v < 9; v++, o += 4) pos[p++] = dv.getFloat32(o, true);
  }
  return pos;
}
function lerTexto(txt){
  const pos = [];
  const re = /vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g;
  let m; while ((m = re.exec(txt))) pos.push(+m[1], +m[2], +m[3]);
  return new Float32Array(pos);
}
function volumeMM3(pos){
  let v = 0;
  for (let i = 0; i < pos.length; i += 9){
    const ax=pos[i],ay=pos[i+1],az=pos[i+2];
    const bx=pos[i+3],by=pos[i+4],bz=pos[i+5];
    const cx=pos[i+6],cy=pos[i+7],cz=pos[i+8];
    v += ax*(by*cz - bz*cy) - ay*(bx*cz - bz*cx) + az*(bx*cy - by*cx);
  }
  return Math.abs(v) / 6;
}
function montar(pos){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  g.computeBoundingBox();
  const c = new THREE.Vector3();
  g.boundingBox.getCenter(c);
  g.translate(-c.x, -c.y, -g.boundingBox.min.z);   // apoia no chão
  g.rotateX(-Math.PI / 2);                          // modelo Z-cima → cena Y-cima
  return g;
}

/* ============================================================
   7. Worker
   ============================================================ */
const worker = new Worker('./worker.js', { type:'module' });
let scadFonte = '';
let proximoId = 0;
const pendentes = new Map();

worker.onerror = (e) => {
  situacao('erro', 'falhou');
  mostrarDiagnostico(['O worker não carregou.\n' + (e.message || e) +
    '\n\nConfira a pasta wasm/: openscad.js, openscad.wasm.js, openscad.wasm e openscad.fonts.js.'], []);
  e.preventDefault();
};
worker.onmessageerror = () => {
  situacao('erro', 'falhou');
  mostrarDiagnostico(['O worker respondeu algo que a página não conseguiu ler.'], []);
};
worker.onmessage = ({ data }) => {
  const r = pendentes.get(data.id);
  if (!r) return;
  pendentes.delete(data.id);
  r(data);
};

function renderizar(parametros, reiniciar = false){
  const id = proximoId++;
  return new Promise(resolver => {
    pendentes.set(id, resolver);
    setTimeout(() => {
      if (!pendentes.has(id)) return;
      pendentes.delete(id);
      resolver({ ok:false, erro:'Passou de 2 minutos sem resposta do OpenSCAD.\nAbra o Console para ver o que travou.' });
    }, 120000);
    worker.postMessage({ id, scad: scadFonte, parametros, reiniciar, arquivos: arquivosScad() });
  });
}

const corpoEl   = document.body;

// O OpenSCAD em WASM às vezes lança um ponteiro de exceção em
// vez de uma mensagem. Traduz para algo acionável.
function traduzErro(txt){
  if (/^\s*\d{6,}\s*$/.test(String(txt).trim()))
    return 'O OpenSCAD abortou sem mensagem — quase sempre é falta de memória.\n'
         + 'Reduza a resolução da exportação, o número de motivos da estampa '
         + 'ou a quantidade de texto nas faixas.';
  return txt;
}

function mostrarDiagnostico(erros, avisos){
  diagEl.innerHTML = '';
  const escapar = (t) => String(t).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  for (const t of erros)  diagEl.insertAdjacentHTML('beforeend', `<div class="e">${escapar(t)}</div>`);
  for (const t of avisos) diagEl.insertAdjacentHTML('beforeend', `<div class="a">${escapar(t)}</div>`);
}

let tarefa = null, ocupado = false;

function agendarRender(){
  clearTimeout(tarefa);
  tarefa = setTimeout(atualizarPrevia, 350);
}

async function atualizarPrevia(){
  const v = validar();
  mostrarDiagnostico(v.erros, v.avisos);
  if (v.erros.length){
    situacao('erro', `${v.erros.length} erro${v.erros.length>1?'s':''}`);
    btnStl.disabled = true;
    return;
  }
  if (ocupado){ agendarRender(); return; }

  ocupado = true;
  situacao('ocupado', 'renderizando…');
  btnStl.disabled = true;

  const t = performance.now();
  const r = await renderizar(paraOpenscad({ resolucao: RES_PREVIA }));
  ocupado = false;

  if (!r.ok){
    situacao('erro', 'o OpenSCAD recusou');
    mostrarDiagnostico([traduzErro(r.erro) + (r.log ? '\n\n' + r.log : '')], []);
    return;
  }

  const pos = lerSTL(r.stl.buffer);
  if (pos.length < 9){
    situacao('erro', 'sólido vazio');
    mostrarDiagnostico(['O OpenSCAD terminou sem erro mas não produziu geometria — '
      + 'alguma operação consumiu a peça inteira. Revise parede, fundo e profundidade da gravação.'], []);
    return;
  }

  ultimoVolume = volumeMM3(pos);
  if (malha){ cena.remove(malha); malha.geometry.dispose(); }
  malha = new THREE.Mesh(montar(pos), material);
  malha.castShadow = true;
  cena.add(malha);
  alvoY = estado.altura / 2;

  btnStl.disabled = false;
  atualizarLeitura();
  situacao('pronto', `${Math.round(performance.now() - t)} ms · ${(pos.length/9).toLocaleString('pt-BR')} triângulos`);
}

// O Safari ignora click() em link que não está no documento,
// então o link precisa entrar no DOM antes. E como alguns
// navegadores bloqueiam o download mesmo assim, fica também um
// link visível no painel como saída manual.

/* ============================================================
   Exportação em 3MF.

   3MF é um ZIP com XML dentro. Diferente do STL, ele guarda a
   unidade — é por isso que um STL às vezes chega no fatiador em
   polegadas. Também é malha indexada, então o arquivo fica bem
   menor que o mesmo modelo em STL.

   O ZIP é escrito à mão, sem compressão (método 0), para não
   depender de biblioteca nenhuma.
   ============================================================ */

const TABELA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipSemCompressao(entradas){
  const cod = new TextEncoder();
  const locais = [], centrais = [];
  let deslocamento = 0;

  for (const [nome, texto] of entradas) {
    const dados = cod.encode(texto);
    const nomeB = cod.encode(nome);
    const soma  = crc32(dados);

    const cab = new DataView(new ArrayBuffer(30));
    cab.setUint32(0, 0x04034B50, true);
    cab.setUint16(4, 20, true);
    cab.setUint32(14, soma, true);
    cab.setUint32(18, dados.length, true);
    cab.setUint32(22, dados.length, true);
    cab.setUint16(26, nomeB.length, true);
    locais.push(new Uint8Array(cab.buffer), nomeB, dados);

    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014B50, true);
    cen.setUint16(4, 20, true);
    cen.setUint16(6, 20, true);
    cen.setUint32(16, soma, true);
    cen.setUint32(20, dados.length, true);
    cen.setUint32(24, dados.length, true);
    cen.setUint16(28, nomeB.length, true);
    cen.setUint32(42, deslocamento, true);
    centrais.push(new Uint8Array(cen.buffer), nomeB);

    deslocamento += 30 + nomeB.length + dados.length;
  }

  const tamCentral = centrais.reduce((n, b) => n + b.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054B50, true);
  fim.setUint16(8,  entradas.length, true);
  fim.setUint16(10, entradas.length, true);
  fim.setUint32(12, tamCentral, true);
  fim.setUint32(16, deslocamento, true);

  const partes = locais.concat(centrais, [new Uint8Array(fim.buffer)]);
  const total = partes.reduce((n, b) => n + b.length, 0);
  const saida = new Uint8Array(total);
  let i = 0;
  for (const b of partes) { saida.set(b, i); i += b.length; }
  return saida;
}

// Triângulos soltos viram malha indexada: vértices repetidos
// colapsam, que é o que o 3MF exige e o que encolhe o arquivo.
function indexar(pos){
  const mapa = new Map();
  const verts = [], tris = [];
  const chave = (x, y, z) => `${Math.round(x*1e4)},${Math.round(y*1e4)},${Math.round(z*1e4)}`;

  for (let i = 0; i < pos.length; i += 9) {
    const t = [];
    for (let v = 0; v < 3; v++) {
      const x = pos[i+v*3], y = pos[i+v*3+1], z = pos[i+v*3+2];
      const k = chave(x, y, z);
      let idx = mapa.get(k);
      if (idx === undefined) { idx = verts.length; verts.push([x, y, z]); mapa.set(k, idx); }
      t.push(idx);
    }
    if (t[0] !== t[1] && t[1] !== t[2] && t[0] !== t[2]) tris.push(t);
  }
  return { verts, tris };
}

// Recebe uma ou mais partes. Com mais de uma, elas viram
// componentes de um mesmo objeto: o fatiador mostra uma peça
// com partes, e cada parte aceita um filamento diferente.
function para3MF(partes){
  const n = (v) => Math.round(v * 1000) / 1000;
  let corpos = '', totalV = 0, totalT = 0;

  partes.forEach((parte, i) => {
    const { verts, tris } = indexar(parte.pos);
    totalV += verts.length; totalT += tris.length;
    corpos += `  <object id="${i+1}" type="model" name="${parte.nome}">\n   <mesh>\n    <vertices>\n`
      + verts.map(v => `     <vertex x="${n(v[0])}" y="${n(v[1])}" z="${n(v[2])}"/>`).join('\n')
      + '\n    </vertices>\n    <triangles>\n'
      + tris.map(t => `     <triangle v1="${t[0]}" v2="${t[1]}" v3="${t[2]}"/>`).join('\n')
      + '\n    </triangles>\n   </mesh>\n  </object>\n';
  });

  let raiz = partes.length;
  if (partes.length > 1) {
    raiz = partes.length + 1;
    corpos += `  <object id="${raiz}" type="model" name="caneca">\n   <components>\n`
      + partes.map((p, i) => `    <component objectid="${i+1}"/>`).join('\n')
      + '\n   </components>\n  </object>\n';
  }

  const xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<model unit="millimeter" xml:lang="en-US" '
    + 'xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">\n'
    + ' <metadata name="Application">Touche3D</metadata>\n'
    + ' <resources>\n' + corpos + ' </resources>\n'
    + ` <build>\n  <item objectid="${raiz}"/>\n </build>\n</model>\n`;

  const tipos = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>'
    + '</Types>';

  const rels = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rel0" Target="/3D/3dmodel.model" '
    + 'Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/>'
    + '</Relationships>';

  return {
    dados: zipSemCompressao([
      ['[Content_Types].xml', tipos],
      ['_rels/.rels', rels],
      ['3D/3dmodel.model', xml],
    ]),
    vertices: totalV,
    triangulos: totalT,
  };
}

function baixar(dados, nome, tipo){
  const url = URL.createObjectURL(new Blob([dados], { type: tipo }));

  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  mostrarLinkManual(url, nome);
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}

function mostrarLinkManual(url, nome){
  const div = document.createElement('div');
  div.className = 'a';
  div.innerHTML = `Se o arquivo não apareceu na pasta de downloads, `
    + `<a href="${url}" download="${nome}" style="color:var(--verde)">clique aqui para baixar ${nome}</a>. `
    + `O link vale por 2 minutos.`;
  diagEl.appendChild(div);
}

const apelido = () => (estado.texto || 'sem-texto').replace(/[^\w-]+/g, '-').toLowerCase();

btnStl.addEventListener('click', async () => {
  btnStl.disabled = true;

  // Cada tentativa começa com uma instância limpa do OpenSCAD:
  // depois de um abort, o runtime não se recupera sozinho.
  const tentativas = [estado.res_export, 96, 80, 64, RES_PREVIA]
    .filter(v => v > 0)
    .filter((v, i, a) => a.indexOf(v) === i)
    .sort((x, y) => y - x);

  // Duas passadas quando o relevo vai separado: o fatiador
  // recebe uma peça com duas partes e cada uma aceita um
  // filamento. Pintar letra com o pincel é inviável.
  const separar = estado.formato === '3mf'
                && estado.separar
                && estado.peca === 'caneca';

  let ultimo = null;

  for (const res of tentativas) {
    situacao('ocupado', `exportando em ${res}…`);
    const partes = [];
    let falhou = null;

    for (const p of (separar ? ['corpo', 'relevo'] : ['tudo'])) {
      const r = await renderizar(paraOpenscad({ resolucao: res, parte: p }), true);
      if (!r.ok) { falhou = r; break; }
      const pos = lerSTL(r.stl.buffer);
      if (pos.length < 9) {
        // "relevo" vazio só quer dizer que não há nada saliente.
        if (p === 'relevo') continue;
        falhou = { erro: 'O OpenSCAD terminou sem erro mas a peça saiu vazia.' };
        break;
      }
      partes.push({ nome: p === 'relevo' ? 'relevo' : 'corpo', pos, stl: r.stl });
    }

    if (falhou) { ultimo = falhou; continue; }

    btnStl.disabled = false;
    const base = estado.peca === 'gabarito' ? 'escudo-placa' : `caneca-${apelido()}`;

    if (estado.formato === '3mf') {
      const m = para3MF(partes);
      baixar(m.dados, base + '.3mf', 'model/3mf');
      situacao('pronto', `3MF salvo em ${res} · ${partes.length} parte${partes.length>1?'s':''} · `
                       + `${m.triangulos.toLocaleString('pt-BR')} triângulos`);
      if (partes.length > 1)
        mostrarDiagnostico([], ['No Bambu Studio a peça chega com duas partes: corpo e relevo. '
          + 'Clique na parte "relevo" na árvore de objetos e escolha outro filamento — não precisa pincel.\n'
          + 'Para as faixas, use botão direito → Height range modifier: elas são faixas de altura exatas.']);
      else if (separar)
        mostrarDiagnostico([], ['Não há nada para separar. Coloque o texto em "Embutido" '
          + '(ou saliente) para ele virar peça de outra cor.']);
    } else {
      baixar(partes[0].stl, base + '.stl', 'model/stl');
      situacao('pronto', `STL salvo em ${res} · ${(partes[0].pos.length/9).toLocaleString('pt-BR')} triângulos`);
    }

    if (res !== tentativas[0])
      mostrarDiagnostico([], [`A exportação em ${tentativas[0]} não passou; o arquivo saiu em ${res}. `
        + 'O que muda é só o facetamento da curva do cilindro.']);
    return;
  }

  btnStl.disabled = false;
  situacao('erro', 'a exportação falhou');
  mostrarDiagnostico([
    'Nenhuma resolução passou, inclusive a mesma do preview — então não é resolução.\n\n'
    + 'Último erro: ' + traduzErro(ultimo && ultimo.erro)
    + ((ultimo && ultimo.log) ? '\n\n' + ultimo.log : '')
    + '\n\nA geometria está certa; o que falta é memória no navegador.\n'
    + 'Clique em "Baixar .scad", abra no OpenSCAD do computador, aperte F6 e '
    + 'exporte em Arquivo → Exportar → 3MF.'
  ], []);
});

// O .scad baixado é o mesmo modelo, com os valores trocados nas
// próprias linhas em vez de um bloco no fim. Sem isso o OpenSCAD
// reclama de cada variável reatribuída, e as anotações de
// customizer (// [min:max:passo]) se perdem.
function scadComValores(){
  let txt = scadFonte;

  const trocar = (nome, valor) => {
    const lit = typeof valor === 'string' ? `"${valor}"` : String(valor);
    const re = new RegExp('^(' + nome + '\\s*=\\s*)[^;]*;', 'm');
    if (re.test(txt)) txt = txt.replace(re, `$1${lit};`);
  };

  for (const c of CAMPOS) if (c.tipo !== 'arquivo') trocar(c.nome, estado[c.nome]);
  trocar('escudo_svg',  !!svgs.escudo);
  trocar('estampa_svg', !!svgs.estampa);
  trocar('resolucao',   estado.res_export);
  trocar('parte',       'tudo');

  // Os contornos entram no lugar das listas vazias, e o include
  // some — o arquivo passa a ser autossuficiente.
  const dados = comoScad('escudo', svgs.escudo) + comoScad('estampa', svgs.estampa);
  for (const linha of dados.trim().split('\n')) {
    const nome = linha.slice(0, linha.indexOf(' ='));
    const re = new RegExp('^(' + nome + '\\s*=\\s*)[^;]*;', 'm');
    if (re.test(txt)) txt = txt.replace(re, linha);
  }
  txt = txt.replace(/^include <svg_dados\.scad>.*$/m,
    '// (os contornos já estão acima; não há arquivo externo a incluir)');

  const cab = `/* Gerado pelo Touché3D em ${new Date().toLocaleString('pt-BR')}.\n`
            + `   Renderize com F6 e exporte em Arquivo → Exportar → STL. */\n\n`;
  return cab + txt;
}

btnScad.addEventListener('click', () => {
  baixar(scadComValores(), `caneca-${apelido()}.scad`, 'text/plain');
});

/* ============================================================
   9. Leitura dimensional e custo
   ============================================================ */
const leituraEl = document.getElementById('leitura');
// Lata de 473 ml: 66 mm de diâmetro, 168 mm de altura.
// Lata de 473 ml: 66 mm de diâmetro, 168 mm de altura.
// Copo Stanley 473: 69 na base, 91 na boca, 165 de altura.
function folgaLata(){
  const d = estado.diam_interno, con = estado.conicidade || 0;
  const util = estado.altura - estado.fundo;

  if (con < 2 && d >= 66.5 && d <= 76)
    return `<br><span>lata 473</span> folga <b>${((d-66)/2).toFixed(1)}</b> mm por lado`
         + `, sobra <b>${(168 - util).toFixed(0)}</b> mm de fora`;

  if (con >= 2 && d >= 69 && d <= 80) {
    // diâmetro do copo na altura em que o suporte termina
    const noTopo = 69 + (91 - 69) * Math.min(1, util / 165);
    const fB = (d - 69) / 2;
    const fT = ((d + con) - noTopo) / 2;
    return `<br><span>Stanley 473</span> folga <b>${fB.toFixed(1)}</b> mm na base, `
         + `<b>${fT.toFixed(1)}</b> mm na boca, sobra <b>${(165 - util).toFixed(0)}</b> mm de fora`;
  }
  return '';
}

function atualizarLeitura(){
  const de  = estado.diam_interno + 2 * estado.parede;
  // Tronco de cone: π·h·(R² + R·r + r²)/3
  const con  = estado.conicidade || 0;
  const rB   = estado.diam_interno/2 + (con/2) * (estado.fundo / estado.altura);
  const rT   = estado.diam_interno/2 + con/2;
  const hUtil = estado.altura - estado.fundo;
  const cap  = Math.PI * hUtil * (rT*rT + rT*rB + rB*rB) / 3 / 1000;

  let linhaCusto = '<span>material</span> <b>—</b>  <span>aguardando render</span>';
  if (ultimoVolume > 0){
    const g     = ultimoVolume / 1000 * DENSIDADE;
    const metro = ultimoVolume / (Math.PI * (DIAM_FILAMENTO/2)**2) / 1000;
    const custo = g / 1000 * estado.preco_kg;
    linhaCusto = `<span>peso</span> <b>${g.toFixed(0)}</b> g &nbsp;·&nbsp;
                  <span>filamento</span> <b>${metro.toFixed(1)}</b> m &nbsp;·&nbsp;
                  <span>custo</span> <b>R$ ${custo.toFixed(2)}</b>`;
  }

  if (estado.peca === 'gabarito'){
    const rex  = estado.diam_interno/2 + estado.parede;
    const arco = svgs.escudo ? estado.escudo_larg
                          : estado.escudo_ang * Math.PI/180 * (rex - estado.escudo_prof + estado.escudo_esp/2);
    const alt  = svgs.escudo ? alturaEscudo() : estado.escudo_alt - 2*estado.escudo_folga;
    leituraEl.innerHTML = `
      <span>placa</span> <b>${(svgs.escudo ? arco : arco - 2*estado.escudo_folga).toFixed(1)}</b> ×
      <b>${alt.toFixed(1)}</b> mm &nbsp;·&nbsp;
      <span>espessura</span> <b>${estado.escudo_esp.toFixed(1)}</b> mm<br>
      <span>saliência no rebaixo</span> <b>${(estado.escudo_esp - estado.escudo_prof).toFixed(1)}</b> mm<br>
      <span class="destaque">${linhaCusto}</span>`;
    return;
  }

  leituraEl.innerHTML = `
    <span>Ø int</span> <b>${estado.diam_interno.toFixed(1)}</b> mm &nbsp;·&nbsp;
    <span>Ø ext</span> <b>${de.toFixed(1)}</b> mm &nbsp;·&nbsp;
    <span>alt</span> <b>${estado.altura.toFixed(1)}</b> mm<br>
    <span>parede</span> <b>${estado.parede.toFixed(1)}</b> mm &nbsp;·&nbsp;
    <span>fundo</span> <b>${estado.fundo.toFixed(1)}</b> mm &nbsp;·&nbsp;
    <span>capacidade</span> <b>${cap.toFixed(0)}</b> ml${folgaLata()}<br>
    <span class="destaque">${linhaCusto}</span>`;
}

/* ============================================================
   10. Partida
   ============================================================ */
(async function iniciar(){
  rotularBotao();
  atualizarLeitura();
  atualizarPintura();
  try {
    scadFonte = await (await fetch('./caneca.scad?v=' + Date.now())).text();
  } catch (e) {
    situacao('erro', 'falhou');
    mostrarDiagnostico(['Não encontrei o caneca.scad. Sirva a pasta por HTTP — '
      + 'abrir o arquivo direto no navegador não funciona.'], []);
    return;
  }
  atualizarPrevia();
})();
